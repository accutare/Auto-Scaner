<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Docflow Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de uma tela; à esquerda a fila de scans, à direita o chat de comandos (empilha no celular) */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --ink: #15202b; --muted: #5b6878; --line: #dde3ea;
  --accent: #1d63d8; --accent-soft: #e6eefc; --ok: #1d7f55; --ok-soft: #e2f3ea;
  --warn: #9a5b00; --warn-soft: #fbf0dc; --err: #b8352a; --err-soft: #fbe6e3;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --panel: #17202a; --ink: #e5ebf1; --muted: #93a1b1; --line: #2a3644;
  --accent: #6aa2ff; --accent-soft: #1a2c47; --ok: #5ccf98; --ok-soft: #143326;
  --warn: #f0b45c; --warn-soft: #3a2b12; --err: #ff8a7d; --err-soft: #3d1d1a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f151c; --panel: #17202a; --ink: #e5ebf1; --muted: #93a1b1; --line: #2a3644;
  --accent: #6aa2ff; --accent-soft: #1a2c47; --ok: #5ccf98; --ok-soft: #143326;
  --warn: #f0b45c; --warn-soft: #3a2b12; --err: #ff8a7d; --err-soft: #3d1d1a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; max-width: 1180px; margin: 0 auto;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 14px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-weight: 600; font-size: 1.15rem; letter-spacing: -0.01em; }
.logo span { color: var(--muted); font-weight: 400; }
.pill { font-size: .78rem; padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
.pill.on { background: var(--ok-soft); color: var(--ok); }
.pill.on::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.pill.demo { background: var(--warn-soft); color: var(--warn); }
.root { margin-left: auto; font-size: .82rem; color: var(--muted); }
.root code { font-family: var(--f-mono); color: var(--ink); }
.main { display: grid; grid-template-columns: 330px 1fr; gap: 14px; min-height: 0; }
@media (max-width: 820px) { .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .queue { max-height: 230px; } }
.queue, .chat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 0; display: flex; flex-direction: column; }
.q-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
.q-head h2 { margin: 0; font-size: .95rem; font-weight: 600; }
.q-head small { color: var(--muted); }
.q-list { overflow-y: auto; padding: 8px; display: grid; gap: 6px; align-content: start; }
.scan { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; background: none; color: inherit; text-align: left; font: inherit; width: 100%; }
.scan:hover, .scan:focus-visible { background: var(--accent-soft); outline: none; border-color: var(--accent); }
.thumb { width: 34px; height: 42px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); position: relative; }
.thumb::after { content: "PDF"; position: absolute; bottom: 3px; left: 3px; font: 600 8px var(--f-mono); color: var(--err); }
.scan b { font: 500 .8rem var(--f-mono); display: block; overflow-wrap: anywhere; }
.scan b em { font-style: normal; background: var(--warn-soft); color: var(--warn); padding: 0 2px; border-radius: 3px; }
.scan small { color: var(--muted); font-size: .76rem; }
.empty { color: var(--muted); font-size: .85rem; padding: 18px 10px; text-align: center; }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.m { max-width: 82%; padding: 10px 12px; border-radius: 10px; font-size: .92rem; overflow-wrap: anywhere; }
.m.user { align-self: flex-end; background: var(--accent); color: #fff; font-family: var(--f-mono); font-size: .88rem; }
.m.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
.m.ok { border-color: var(--ok); background: var(--ok-soft); }
.m.err { border-color: var(--err); background: var(--err-soft); }
.m .t { display: block; font-size: .72rem; color: var(--muted); margin-top: 4px; }
.m.user .t { color: rgba(255,255,255,.75); }
.path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 8px 0; font: .82rem var(--f-mono); }
.path span { background: var(--panel); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; }
.path i { font-style: normal; color: var(--muted); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
button.b { font: 500 .85rem var(--f-body); padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.b.p { background: var(--accent); border-color: var(--accent); color: #fff; }
button.b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.b:disabled { opacity: .5; cursor: default; }
.sug { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.sug button { font: .78rem var(--f-mono); padding: 3px 8px; border-radius: 5px; border: 1px dashed var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
form { border-top: 1px solid var(--line); padding: 10px; display: grid; gap: 6px; }
.row { display: flex; gap: 8px; }
#cmd { flex: 1; min-width: 0; font: .95rem var(--f-mono); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
#cmd:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.hint { font-size: .76rem; color: var(--muted); }
.hint code { font-family: var(--f-mono); color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .m { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(4px); opacity: .6; } } }

.chat { position: relative; }
#picker { position: absolute; inset: 0; background: var(--panel); border-radius: 10px; display: flex; flex-direction: column; z-index: 2; }
.pk-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.pk-head h3 { margin: 0; font-size: .95rem; }
.pk-head small { display: block; font: .8rem var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.pk-head .b { margin-left: auto; }
.pk-busca { padding: 10px 14px 0; }
#busca { width: 100%; font: .95rem var(--f-body); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
#busca:focus { outline: 2px solid var(--accent); }
#trilha { padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: .82rem; border-bottom: 1px solid var(--line); }
#trilha button { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 2px 4px; border-radius: 4px; }
#trilha button:hover { background: var(--accent-soft); }
#trilha i { font-style: normal; color: var(--muted); }
#pastas { flex: 1; overflow-y: auto; padding: 8px; display: grid; gap: 2px; align-content: start; min-height: 0; }
.pasta { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 7px; padding: 8px 10px; color: var(--ink); font: .9rem var(--f-body); cursor: pointer; }
.pasta:hover, .pasta:focus-visible { background: var(--accent-soft); border-color: var(--accent); outline: none; }
.pasta::before { content: ""; width: 18px; height: 14px; flex: none; border-radius: 2px 4px 3px 3px; background: var(--accent); opacity: .75; }
.pasta small { color: var(--muted); font-size: .76rem; display: block; overflow-wrap: anywhere; }
.pk-pe { border-top: 1px solid var(--line); padding: 10px 14px; display: grid; gap: 8px; }
.pk-pe .destino { font: .82rem var(--f-mono); overflow-wrap: anywhere; }
</style>
</head><body>
<div class="app">
  <header>
    <div class="logo">Docflow <span>· Scanner</span></div>
    <span class="pill on" id="status">Conectado</span>
  </header>
  <div class="main">
    <section class="queue" aria-labelledby="qh">
      <div class="q-head"><h2 id="qh">Aguardando destino</h2><small id="qcount"></small></div>
      <div class="q-list" id="qlist"><div class="empty">Carregando os scans...</div></div>
    </section>
    <section class="chat" aria-label="Comandos">

      <div id="picker" hidden>
        <div class="pk-head"><div><h3>Para onde vai este scan?</h3><small id="pkArquivo"></small></div><button class="b" type="button" id="pkFechar">Fechar</button></div>
        <div class="pk-busca"><input id="busca" autocomplete="off" placeholder="Buscar pelo nome: empresa, dono, pasta..." aria-label="Buscar pasta"></div>
        <nav id="trilha" aria-label="Caminho"></nav>
        <div id="pastas"></div>
        <div class="pk-pe">
          <div class="destino" id="pkDestino">Escolha uma pasta.</div>
          <div class="acts" id="pkAcoes"><button class="b p" type="button" id="pkMover" disabled>Mover para cá</button></div>
        </div>
      </div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form id="f">
        <div class="row">
          <input id="cmd" autocomplete="off" placeholder="5715 > AN1000 > AN1000BL > 11" aria-label="Comando">
          <button class="b p" type="submit" id="enviar">Enviar</button>
        </div>
        <div class="hint">Toque num scan da lista para escolher a pasta no mapa. Também dá para escrever: <code>5715 &gt; AN1000 &gt; AN1000BL &gt; 11</code>.</div>
      </form>
    </section>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const agora = () => new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(url, corpo) {
  const r = await fetch(url, corpo ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) } : {});
  if (!r.ok) throw new Error((await r.text()) || r.status);
  return r.json();
}

function msg(html, cls = "bot") {
  const d = document.createElement("div");
  d.className = "m " + cls;
  d.innerHTML = html + `<span class="t">${agora()}</span>`;
  $("#msgs").appendChild(d);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
  return d;
}

async function fila() {
  try {
    const scans = await api("/api/scans");
    $("#status").textContent = "Conectado"; $("#status").className = "pill on";
    $("#qcount").textContent = scans.length + (scans.length === 1 ? " arquivo" : " arquivos");
    $("#qlist").innerHTML = scans.length ? scans.map(s => {
      const ponto = s.nome.lastIndexOf("."), base = ponto > 0 ? s.nome.slice(0, ponto) : s.nome, ext = ponto > 0 ? s.nome.slice(ponto) : "";
      const fim = base.slice(-4);
      return `<button class="scan" data-caminho="${esc(s.caminho)}" data-nome="${esc(s.nome)}"><span class="thumb"></span><span><b>${esc(base.slice(0, -4))}<em>${esc(fim)}</em>${esc(ext)}</b><small>Escaneado em ${esc(s.hora)}</small></span></button>`;
    }).join("") : `<div class="empty">Nenhum scan esperando. Tudo organizado.</div>`;
    document.querySelectorAll(".scan").forEach(b => b.onclick = () => abrirMapa(b.dataset.caminho, b.dataset.nome));
  } catch (e) {
    $("#status").textContent = "Sem conexão com o servidor"; $("#status").className = "pill demo";
  }
}

async function executar(texto) {
  let r;
  try { r = await api("/api/resolver", { texto }); }
  catch (e) { return msg("Não consegui falar com o servidor. Tente de novo em instantes.", "bot err"); }
  if (!r.ok) {
    const d = msg(esc(r.mensagem) + (r.opcoes && r.opcoes.length ? `<div class="sug">${r.opcoes.map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""), "bot err");
    d.querySelectorAll(".sug button").forEach(b => b.onclick = () => {
      const partes = texto.split(/\s*>\s*|\s+/).filter(Boolean);
      if (r.tipo_opcoes === "arquivo") {
        const base = b.dataset.o.replace(/\.[^.]+$/, "");
        partes[0] = base.slice(-8);
      } else {
        partes.splice(r.nivel + 1, partes.length, b.dataset.o.split(/[\s-]/)[0]);
      }
      $("#cmd").value = partes.join(" > "); $("#cmd").focus();
    });
    return;
  }
  const d = msg(`Vou mover <b style="font-family:var(--f-mono)">${esc(r.arquivo.nome)}</b> para:
    <div class="path">${r.caminho.map((p, i) => `${i ? "<i>›</i>" : ""}<span>${esc(p)}</span>`).join("")}</div>
    <div class="acts"><button class="b p" data-a="ok">Mover agora</button><button class="b" data-a="no">Cancelar</button></div>`);
  d.querySelector('[data-a="ok"]').onclick = async () => {
    d.querySelectorAll("button").forEach(b => b.disabled = true);
    try {
      const m = await api("/api/mover", { texto, arquivo: r.arquivo.caminho });
      if (m.ok) msg(`Movido. <b style="font-family:var(--f-mono)">${esc(r.arquivo.nome)}</b> está em <code>${esc(m.caminho[m.caminho.length - 1])}</code>.`, "bot ok");
      else msg(esc(m.mensagem), "bot err");
    } catch (e) { msg("Não consegui mover. Nada foi alterado. Tente de novo.", "bot err"); }
    fila();
  };
  d.querySelector('[data-a="no"]').onclick = () => { d.querySelectorAll("button").forEach(b => b.disabled = true); msg("Cancelado. O arquivo continua na pasta de scans."); };
}

$("#f").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("#cmd").value.trim(); if (!t) return;
  msg(esc(t), "user"); $("#cmd").value = ""; executar(t);
});


// ---------- Mapa de pastas ----------
let pk = { arquivo: null, nome: "", rel: "" };
async function abrirMapa(caminho, nome) {
  pk = { arquivo: caminho, nome, rel: "" };
  $("#pkArquivo").textContent = nome; $("#busca").value = "";
  $("#picker").hidden = false; await navegar("");
  $("#busca").focus();
}
$("#pkFechar").onclick = () => { $("#picker").hidden = true; };
function mostrarDestino() {
  const partes = pk.rel ? pk.rel.split("/") : [];
  $("#pkDestino").textContent = partes.length ? partes.join(" › ") : "Escolha uma pasta.";
  $("#pkAcoes").innerHTML = `<button class="b p" type="button" id="pkMover" ${partes.length ? "" : "disabled"}>Mover para cá</button>`;
  $("#pkMover").onclick = confirmar;
}
async function navegar(rel) {
  pk.rel = rel; mostrarDestino();
  const partes = rel ? rel.split("/") : [];
  $("#trilha").innerHTML = `<button data-r="">Início</button>` + partes.map((p, i) => `<i>›</i><button data-r="${esc(partes.slice(0, i + 1).join("/"))}">${esc(p)}</button>`).join("");
  $("#trilha").querySelectorAll("button").forEach(b => b.onclick = () => navegar(b.dataset.r));
  $("#pastas").innerHTML = `<div class="empty">Carregando...</div>`;
  try {
    const r = await api("/api/pastas?caminho=" + encodeURIComponent(rel));
    $("#pastas").innerHTML = r.pastas.length ? r.pastas.map(n => `<button class="pasta" data-n="${esc(n)}">${esc(n)}</button>`).join("")
      : `<div class="empty">Não tem subpastas aqui. Pode mover para esta pasta.</div>`;
    $("#pastas").querySelectorAll(".pasta").forEach(b => b.onclick = () => navegar((rel ? rel + "/" : "") + b.dataset.n));
  } catch (e) { $("#pastas").innerHTML = `<div class="empty">Não consegui abrir esta pasta. Tente de novo.</div>`; }
}
let tBusca;
$("#busca").addEventListener("input", () => {
  clearTimeout(tBusca);
  const q = $("#busca").value.trim();
  if (!q) return navegar(pk.rel);
  tBusca = setTimeout(async () => {
    try {
      const r = await api("/api/buscar?q=" + encodeURIComponent(q));
      $("#pastas").innerHTML = r.resultados.length ? r.resultados.map(c => { const ps = c.split("/"); return `<button class="pasta" data-c="${esc(c)}"><span>${esc(ps[ps.length - 1])}<small>${esc(ps.slice(0, -1).join(" › "))}</small></span></button>`; }).join("")
        : `<div class="empty">${esc(r.aviso || "Nenhuma pasta encontrada com esse nome.")}</div>`;
      $("#pastas").querySelectorAll(".pasta").forEach(b => b.onclick = () => { $("#busca").value = ""; navegar(b.dataset.c); });
    } catch (e) { $("#pastas").innerHTML = `<div class="empty">Não consegui buscar. Tente de novo.</div>`; }
  }, 250);
});
function confirmar() {
  $("#pkAcoes").innerHTML = `<span>Mover <b>${esc(pk.nome)}</b> para esta pasta?</span><button class="b p" type="button" id="pkSim">Confirmar</button><button class="b" type="button" id="pkNao">Voltar</button>`;
  $("#pkNao").onclick = mostrarDestino;
  $("#pkSim").onclick = async () => {
    $("#pkSim").disabled = true; $("#pkNao").disabled = true;
    try {
      const m = await api("/api/mover_pasta", { arquivo: pk.arquivo, destino: pk.rel });
      if (m.ok) {
        $("#picker").hidden = true;
        msg(`Movido. <b style="font-family:var(--f-mono)">${esc(pk.nome)}</b> está em <code>${esc(m.caminho.join(" › "))}</code>.`, "bot ok");
      } else { msg(esc(m.mensagem), "bot err"); mostrarDestino(); }
    } catch (e) { msg("Não consegui mover. Nada foi alterado. Tente de novo.", "bot err"); mostrarDestino(); }
    fila();
  };
}
fila(); setInterval(fila, 15000);
msg(`Olá! Quando um scan chegar, toque nele na lista e escolha a pasta no mapa: busque pelo nome da empresa ou do dono, ou vá clicando nas pastas. Eu mostro o caminho completo e só movo depois que você confirmar. Nunca excluo nada.`);
</script>
</body></html>
