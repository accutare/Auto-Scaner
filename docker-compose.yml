services:
  docflow:                         # leitura automática dos scans (ligada só com AUTOMATICO=sim)
    build: .
    container_name: docflow
    restart: unless-stopped        # volta sozinho se travar ou se o servidor reiniciar
    env_file: .env
    volumes:
      - ./dados:/data              # banco de controle e senha do app (persistente)
    logging: &log
      driver: json-file
      options:
        max-size: "10m"            # evita o log encher o disco
        max-file: "5"

  web:                             # app da pessoa do scanner (comandos por código)
    build: .
    container_name: docflow-web
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "app.web:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    volumes:
      - ./dados:/data
    logging: *log

  caddy:                           # HTTPS automático (certificado gratuito) na frente do app
    image: caddy:2.8.4
    container_name: docflow-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *log

volumes:
  caddy_data:
  caddy_config:
